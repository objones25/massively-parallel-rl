# Test, then build the RunPod training image and push it to GHCR (ghcr.io/objones25/massively-parallel-rl).
# Runs on main (tags: sha and latest) and on feat/** (tag: sha only) while the project is on a feature branch.
# The tests run first through workflow_call + `needs`, not workflow_run: workflow_run only fires for workflows
# on the default branch, so it would never build from a feature branch, and `needs` gates the build on the
# exact commit that was tested.
name: image

on:
  push:
    branches: [main, "feat/**"]

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read # checkout

  image:
    name: build and push
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # checkout
      packages: write # push the image to GHCR (this job only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The RunPod base (10.6 GB compressed) unpacks to more than the runner's free disk; drop the preinstalled
      # SDKs this job never uses (Android, .NET, Haskell, cached Docker images, the tool cache).
      - uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true
          large-packages: false
      - name: Disk after cleanup
        run: df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          image="ghcr.io/${REPO,,}"
          {
            echo "tags<<EOF"
            echo "${image}:${SHA}"
            if [[ $REF == refs/heads/main ]]; then echo "${image}:latest"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            MPRL_IMAGE_DIGEST=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
