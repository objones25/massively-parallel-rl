[project]
name = "mprl"
version = "0.1.0"
description = "Massively parallel RL: Unitree G1 walking on mjlab at many parallel env counts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mjlab==1.6.0",
    # torch and torchvision are pinned to exactly what the Docker base image ships
    # (runpod/pytorch:1.0.2-cu1281-torch280-ubuntu2404: torch 2.8.0 + torchvision 0.23.0 from the
    # cu128 index), so the image reuses the base's copies instead of downloading them again.
    # mjlab 1.6.0 needs torch>=2.7.0; rsl-rl-lib 5.4.2 needs torch>=2.6.0, torchvision>=0.5.0.
    # Listed directly (torchvision too) so [tool.uv.sources] below can route them per platform.
    "torch==2.8.0",
    "torchvision==0.23.0",
    "huggingface_hub",
    "httpx",
    # Hugging Face's HTTP client; mprl.hub catches its connection errors (httpx2.TransportError).
    "httpx2",
    "imageio[ffmpeg]",
    "pillow",
    "matplotlib",
    "tyro",
    "python-dotenv",
]

[project.scripts]
mprl = "mprl.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pytest-randomly",
    "pytest-xdist",
    "ruff",
    "pyright",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mprl"]

# --- torch wheels --------------------------------------------------------
# Linux (the A100 pod and CI) takes the CUDA 12.8 build from the same index the
# Docker base image installed it from; macOS keeps the default PyPI (CPU/MPS)
# wheel. The Linux CUDA wheel also runs on CPU-only machines (GitHub runners).
[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

# --- pytest (merged from pytest-expert assets/pytest-config.toml) ---------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
strict = true
addopts = [
    "--import-mode=importlib",
    "-ra",
    "--showlocals",
    "--tb=short",
    # Default = the fast tier. A later -m on the command line replaces this one: `pytest -m smoke`.
    # Coverage is not on by default (its floor needs the smoke tier); see CLAUDE.md for the CI command.
    "-m", "not smoke and not network and not gpu",
]
markers = [
    "smoke: real mjlab / rsl_rl / wandb offline / ffmpeg / subprocesses on CPU; deselected by default (pytest -m smoke)",
    "network: real W&B / Hugging Face / RunPod calls; needs keys; deselected by default",
    "gpu: requires CUDA; deselected by default (pytest -m gpu on the pod)",
]
# pytest-timeout 2.4.0 (keys verified in its installed pytest_timeout.py): a fast-tier test that runs
# past 60 s fails with every thread's stack; the signal method raises in the main thread, which also
# interrupts a blocked read. tests/conftest.py gives smoke / network / gpu tests 600 s.
timeout = 60
timeout_method = "signal"
# Warnings are errors, except three third-party deprecations emitted by mjlab 1.6.0 itself
# (not our code): torch.jit.script at import (mjlab/utils/lab_api/math.py), and the legacy
# TorchScript ONNX exporter used by MjlabOnPolicyRunner.save (mjlab/rl/runner.py).
# Remove each once mjlab stops triggering it.
filterwarnings = [
    "error",
    "ignore:`torch.jit.script` is deprecated:FutureWarning",
    "ignore:You are using the legacy TorchScript-based ONNX export:DeprecationWarning",
    "ignore:The feature will be removed. Please remove usage of this function:DeprecationWarning:torch.onnx",
]
# Backstop beyond every pytest-timeout: dump all stacks and exit if a test still runs (a hang in C code).
faulthandler_timeout = 900
faulthandler_exit_on_timeout = true
pythonpath = ["src", "tests"]  # tests/support.py: helpers shared by the smoke tests

[tool.coverage.run]
branch = true
source = ["src"]
# negative_space.py is a verbatim vendored copy, tested upstream in the skill.
omit = ["*/tests/*", "*/__main__.py", "*/_version.py", "*/mprl/negative_space.py"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "\\.\\.\\.",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]

# --- ruff (merged from pytest-expert assets/ruff-pytest.toml) -------------
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["PT", "B", "S", "SIM", "RUF", "E", "F", "I", "UP", "ARG", "DTZ", "PGH004"]
ignore = ["PT001", "PT023", "E501"]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "tuple"
parametrize-values-type = "list"
parametrize-values-row-type = "tuple"
raises-require-match-for = ["BaseException", "Exception", "ValueError", "OSError", "IOError", "socket.error"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "S311", "ARG001", "SIM105"]
"**/test_*.py" = ["S101", "S311", "ARG001", "SIM105"]
"**/conftest.py" = ["S101", "S311", "ARG001"]
"**/scripts/*.py" = ["S603", "S607"]
# Verbatim skill copy; its Python 3.10 fallback and noqa comments are intentional.
"scripts/audit_negative_space.py" = ["UP035", "RUF100"]
# negative_space.py is a verbatim copy of the skill asset; do not reformat it.
"src/mprl/negative_space.py" = ["N818", "UP", "RUF", "SIM", "E", "I"]

# --- pyright --------------------------------------------------------------
# Strict on our own code (src/mprl). Relaxed, because mjlab / rsl_rl / warp / mujoco are
# only partially typed and strict mode would flag every call into them rather than
# our mistakes:
#   reportMissingTypeStubs, reportUnknown{Member,Variable,Argument,Parameter}Type,
#   reportMissingModuleSource, reportUntypedFunctionDecorator are downgraded to "none".
# Everything else stays at strict (unused imports, optional access, missing annotations
# on our functions, incompatible overrides, ...). Tighten these as the libraries gain types.
[tool.pyright]
include = ["src/mprl"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "none"
reportUnknownLambdaType = "none"
reportMissingModuleSource = "none"
reportUntypedFunctionDecorator = "none"
